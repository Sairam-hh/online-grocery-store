<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — FreshCart</title>
<meta name="description" content="Log in to manage your FreshCart account and orders."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06120d;--bg-2:#0b1810;--surface:rgba(255,255,255,.04);
  --text:#e9f5ec;--muted:#7aa88a;--border:rgba(255,255,255,.08);
  --primary:#22C55E;--accent:#84CC16;--pink:#10b981;
  --grad:linear-gradient(135deg,#22C55E 0%,#84CC16 50%,#10b981 100%);
  --glow:0 0 40px rgba(34,197,94,.45);--r:18px;
}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6;width:100%;max-width:100vw;position:relative}
body.light{--bg:#f5fbf6;--bg-2:#ffffff;--surface:rgba(0,0,0,.04);--text:#0b1810;--muted:#4a6655;--border:rgba(0,0,0,.08)}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.1}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{max-width:1240px;margin:0 auto;padding:0 24px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Preloader */
#preloader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#preloader.done{opacity:0;visibility:hidden;pointer-events:none}
.loader-ring{width:64px;height:64px;border-radius:50%;border:3px solid transparent;border-top-color:var(--primary);border-right-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#scroll-progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:1000;transition:width .1s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:.92rem;cursor:pointer;border:none;transition:.3s;text-decoration:none;white-space:nowrap;line-height:1}
.btn span{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(34,197,94,.7)}

/* Orbs */
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 12s ease-in-out infinite;pointer-events:none;z-index:1}
.orb-1{width:min(480px,100vw);height:min(480px,100vw);background:var(--primary);top:-120px;left:-100px}
.orb-2{width:min(380px,80vw);height:min(380px,80vw);background:var(--accent);bottom:-80px;right:-80px;animation-delay:-4s}
.orb-3{width:min(300px,70vw);height:min(300px,70vw);background:var(--pink);top:40%;left:40%;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}

/* Auth */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:60px 20px;position:relative;overflow:hidden}
.auth-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.2}
.auth-bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(6,18,13,.9),rgba(11,24,16,.97))}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(circle at center,black 30%,transparent 70%);opacity:.3;z-index:-1}

.auth-card{position:relative;z-index:2;width:100%;max-width:460px;background:rgba(11,24,16,.65);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;padding:44px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:fadeUp .8s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.auth-card::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;pointer-events:none}
body.light .auth-card{background:rgba(245,251,246,.75)}

.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px}
.auth-logo .logo-mark{width:48px;height:48px;font-size:1.6rem}
.auth-logo-name{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700}
.auth-card h2{text-align:center;font-size:1.8rem;margin-bottom:8px}
.auth-sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:30px}

/* Role segmented toggle */
.side-label{display:block;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:.72rem;margin:4px 0 8px}
.role-seg{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:14px;padding:5px;margin-bottom:18px;overflow:hidden}
.role-seg input{position:absolute;opacity:0;pointer-events:none}
.role-seg label{position:relative;z-index:2;text-align:center;padding:11px 4px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px;transition:color .25s;display:flex;align-items:center;justify-content:center;gap:6px;user-select:none;white-space:nowrap}
.role-seg .seg-thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc(33.33% - 5px);background:var(--grad);border-radius:10px;box-shadow:var(--glow);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.role-seg input[value="admin"]:checked~.seg-thumb{transform:translateX(100%)}
.role-seg input[value="delivery"]:checked~.seg-thumb{transform:translateX(200%)}
.role-seg input[value="customer"]:checked+label,
.role-seg input[value="admin"]:checked+label,
.role-seg input[value="delivery"]:checked+label{color:#fff}

/* Fields */
.field{position:relative;margin-bottom:16px}
.field input{width:100%;padding:16px 16px 16px 46px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:.95rem;outline:none;transition:.3s}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(34,197,94,.18);transform:translateY(-1px)}
.field input.invalid{border-color:#ff6b8b;box-shadow:0 0 0 4px rgba(255,107,139,.15)}
.field input::placeholder{color:var(--muted)}
.field>i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);transition:.3s;pointer-events:none}
.field input:focus~i{color:var(--primary)}
.field .toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:6px;transition:.3s}
.field .toggle-pw:hover{color:var(--primary)}
body.light .field input{background:rgba(255,255,255,.7);color:var(--text)}

.field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:.88rem}
.field-row label{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
.field-row a{color:var(--accent)}

/* Error messages */
.err-msg{color:#ff6b8b;font-size:.8rem;margin:-8px 0 12px;display:none}
.err-msg.show{display:block}

/* Submit button */
.btn-full{width:100%;justify-content:center;padding:14px;position:relative;overflow:hidden}
.btn-full.loading{pointer-events:none}
.btn-full.loading span{opacity:0}
.btn-full.loading::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;transform:translate(-50%,-50%)}

/* Divider & social */
.divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--muted);font-size:.82rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.social-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
.social-btn{padding:12px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;color:var(--text);cursor:pointer;transition:.3s;font-size:1.1rem;display:grid;place-items:center;text-decoration:none}
.social-btn:hover{border-color:var(--primary);background:rgba(34,197,94,.1);transform:translateY(-2px)}

.auth-foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:18px}
.auth-foot a{color:var(--accent);font-weight:600}

/* Back link */
.back-link{position:fixed;top:20px;left:20px;color:var(--muted);font-size:.88rem;z-index:60;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(11,24,16,.65);border:1px solid var(--border);backdrop-filter:blur(10px);transition:.3s;white-space:nowrap}
.back-link:hover{color:var(--text);transform:translateX(-4px);border-color:var(--primary)}
@media(max-width:600px){.back-link{top:14px;left:12px;font-size:.8rem;padding:6px 12px}}

/* ToTop */
#toTop{position:fixed;bottom:30px;right:30px;width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;font-size:1.1rem;box-shadow:var(--glow);opacity:0;visibility:hidden;transition:.3s;z-index:99}
#toTop.show{opacity:1;visibility:visible}
#toTop:hover{transform:translateY(-4px)}

@media(max-width:600px){.auth-card{padding:30px 22px}.nav-cta{gap:8px}.nav-cta .btn{padding:9px 14px;font-size:.82rem}}
.nav-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}
.logo-img{
  width:120px;
  height:50px;
  border-radius: 10px;
}
</style>
</head>
<body>

<div id="preloader"><div class="loader-ring"></div></div>
<div id="scroll-progress"></div>

<!-- Ambient background -->
<video class="auth-video" autoplay muted loop playsinline preload="metadata">
  <source src="https://assets.mixkit.co/videos/preview/mixkit-vegetable-market-stand-4213-large.mp4" type="video/mp4">
</video>
<div class="auth-bg"></div>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to home</a>

<div class="auth-wrap">
  <div class="auth-card">

    <a class="nav-logo" href="index.html">
      <img src="./assests/stackly-green-color-logo.webp" alt="grocery store Logo" class="logo-img">
    </a>

    <h2>Welcome <span class="grad-text">back</span></h2>
    <p class="auth-sub">Log in to continue shopping fresh &amp; organic.</p>

    <form id="loginForm" novalidate>

      <!-- Role segmented toggle (3 options) -->
      <label class="side-label">Sign in as</label>
      <div class="role-seg" role="radiogroup" aria-label="Select role">
        <input type="radio" name="role" id="roleCustomer" value="customer" checked>
        <label for="roleCustomer"><i class="fa-solid fa-user"></i> Customer</label>
        <input type="radio" name="role" id="roleAdmin" value="admin">
        <label for="roleAdmin"><i class="fa-solid fa-user-shield"></i> Admin</label>
        <input type="radio" name="role" id="roleDelivery" value="delivery">
        <label for="roleDelivery"><i class="fa-solid fa-motorcycle"></i> Delivery</label>
        <span class="seg-thumb" aria-hidden="true"></span>
      </div>

      <!-- Email -->
      <div class="field">
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required maxlength="254">
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="err-msg" id="errEmail">Please enter a valid email address.</div>

      <!-- Password -->
      <div class="field">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password" minlength="8" maxlength="128" required>
        <i class="fa-solid fa-lock"></i>
        <button type="button" class="toggle-pw" aria-label="Show password"
          onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.innerHTML=p.type==='password'?'<i class=\'fa-regular fa-eye\'></i>':'<i class=\'fa-regular fa-eye-slash\'></i>'">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
      <div class="err-msg" id="errPw">Password must be 8+ chars with upper, lower, number &amp; symbol.</div>

      <!-- Remember / Forgot -->
      <div class="field-row">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="error.html">Forgot password?</a>
      </div>

      <button class="btn btn-primary btn-full" type="submit">
        <span><i class="fa-solid fa-arrow-right-to-bracket"></i> Log in</span>
      </button>
    </form>

    <!-- Inline validation + submit logic -->
    <script>
    (function(){
      const f=document.getElementById('loginForm');
      const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
      const PW_RE=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
      f.addEventListener('submit',e=>{
        e.preventDefault();
        const email=document.getElementById('email').value.trim();
        const pw=document.getElementById('pw').value;
        const role=document.querySelector('input[name=role]:checked').value;
        const remember=document.getElementById('remember').checked;
        const eE=document.getElementById('errEmail'),eP=document.getElementById('errPw');
        const emIn=document.getElementById('email'),pwIn=document.getElementById('pw');
        emIn.classList.remove('invalid');pwIn.classList.remove('invalid');
        eE.classList.remove('show');eP.classList.remove('show');
        let ok=true;
        if(!EMAIL_RE.test(email)||email.length>254){eE.classList.add('show');emIn.classList.add('invalid');ok=false}
        if(!PW_RE.test(pw)){eP.classList.add('show');pwIn.classList.add('invalid');ok=false}
        if(!ok)return;
        const b=f.querySelector('button[type=submit]');b.classList.add('loading');
        setTimeout(()=>{
          const session={email,role,name:email.split('@')[0],ts:Date.now()};
          const store=remember?localStorage:sessionStorage;
          store.setItem('freshcart_auth',JSON.stringify(session));
          localStorage.setItem('freshcart_auth',JSON.stringify(session));
          b.innerHTML='<i class="fa-solid fa-check"></i> <span>Welcome!</span>';
          const dest=role==='admin'?'admin-dashboard.html':role==='delivery'?'delivery-dashboard.html':'customer-dashboard.html';
          setTimeout(()=>{document.body.style.transition='opacity .35s';document.body.style.opacity='0';setTimeout(()=>location.href=dest,350)},500);
        },900);
      });
      const clr=(id,errId)=>{const el=document.getElementById(id),er=document.getElementById(errId);if(el&&er)el.addEventListener('input',()=>{er.classList.remove('show');el.classList.remove('invalid')})};
      clr('email','errEmail');clr('pw','errPw');
    })();
    </script>

    <div class="divider">or continue with</div>
    <div class="social-btns">
      <a href="error.html" class="social-btn" aria-label="Google"><i class="fa-brands fa-google"></i></a>
      <a href="error.html" class="social-btn" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="error.html" class="social-btn" aria-label="Apple"><i class="fa-brands fa-apple"></i></a>
    </div>

    <div class="auth-foot">New to Stackly? <a href="signup.html">Create an account</a></div>
  </div>
</div>

<button id="toTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

<script>
// Preloader
window.addEventListener('load',()=>{setTimeout(()=>document.getElementById('preloader').classList.add('done'),400)});

// Scroll progress + toTop
const toTop=document.getElementById('toTop'),sp=document.getElementById('scroll-progress');
window.addEventListener('scroll',()=>{
  const h=document.documentElement;
  sp.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100+'%';
  toTop.classList.toggle('show',scrollY>500);
});
toTop.onclick=()=>scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
